name: Chemdor 7/24 AI Cloud Motoru

on:
  schedule:
    - cron: "*/3 * * * *" # Her 3 dakikada bir çalışır (GitHub'ın izin verdiği en hızlı ayar)
  push:
    paths:
      - 'Progen_Analitik_Fiyat_Listesi_2026_V2.xlsx'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ai-calistir:
    runs-on: ubuntu-latest
    steps:
      - name: Dosyaları Sunucuya Çek
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gerekli Kütüphaneleri Yükle
        run: pip install pandas openpyxl pillow groq requests

      - name: Yapay Zeka Ajanını Çalıştır
        env:
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
        run: python3 ai_updater.py

      - name: Yeni Verileri ve Resimleri Siteye Kaydet
        run: |
          git config --global user.name "Chemdor AI Bot"
          git config --global user.email "bot@chemdor.com"
          git add static/images/products/* products.json || true
          git diff --quiet && git diff --staged --quiet || git commit -m "3 Dakika Döngüsü: Yeni ürünler, Akıllı Görseller ve 3 Dil Eklendi"
          git push origin main